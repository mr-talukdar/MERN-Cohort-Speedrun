<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kidney Health Check</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
        background: #eef4f3;
        color: #173331;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 24px;
        background: linear-gradient(135deg, #eef4f3, #d8ebe4);
      }

      main {
        width: min(100%, 480px);
        padding: 40px;
        border: 1px solid #c7ded7;
        border-radius: 16px;
        background: #ffffff;
        box-shadow: 0 18px 45px rgba(31, 76, 68, 0.14);
      }

      .eyebrow {
        margin: 0 0 10px;
        color: #16806b;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 8vw, 3rem);
        line-height: 1;
      }

      .intro {
        margin: 16px 0 28px;
        color: #58716c;
        line-height: 1.6;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 700;
      }

      .input-row {
        display: flex;
        gap: 10px;
      }

      input,
      button {
        min-height: 48px;
        border-radius: 8px;
        font: inherit;
      }

      input {
        width: 100%;
        border: 1px solid #bdd3cd;
        padding: 0 14px;
      }

      input:focus {
        outline: 3px solid #bde7dc;
        border-color: #16806b;
      }

      button {
        border: 0;
        padding: 0 20px;
        background: #16806b;
        color: #ffffff;
        cursor: pointer;
        font-weight: 700;
        white-space: nowrap;
      }

      button:hover {
        background: #0f6655;
      }

      .result {
        margin: 28px 0 0;
        border-left: 4px solid #16806b;
        padding: 14px 16px;
        background: #f0faf7;
        color: #24564d;
        line-height: 1.5;
      }

      .result.error {
        border-color: #c65d4b;
        background: #fff3f0;
        color: #86382d;
      }

      @media (max-width: 420px) {
        main {
          padding: 28px 22px;
        }

        .input-row {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Express demo</p>
      <h1>Kidney health check</h1>
      <p class="intro">
        Enter a name to check the kidney data stored by the server.
      </p>

      <form method="get" action="/">
        <label for="user">User name</label>
        <div class="input-row">
          <input
            id="user"
            name="user"
            value="{{USER}}"
            placeholder="Try John"
            required />
          <button type="submit">Check health</button>
        </div>
      </form>

      {{RESULT}}
    </main>
  </body>
</html>
